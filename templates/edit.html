<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Edit Student</h1>

    <form action="/update/{{ student.student_id }}" method="POST">

        <input type="text"
               name="name"
               value="{{ student.name }}"
               required>

        <input type="email"
               name="email"
               value="{{ student.email }}">

        <input type="text"
               name="course"
               value="{{ student.course }}">

        <input type="number"
               name="semester"
               value="{{ student.semester }}">

        <button type="submit">Update Student</button>

    </form>

    <a href="/">Back to Students</a>

</div>

</body>
</html>
